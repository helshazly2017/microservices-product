apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: your-dockerhub-username/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: DATABASE_URL
          value: "postgresql+psycopg://postgres:postgres@postgres-db:5432/orders_db"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort # Exposes the service container outside your cluster boundary
  selector:
    app: order-service
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002
    nodePort: 30082 # Access your browser via http://localhost:30082
