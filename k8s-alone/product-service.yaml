apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: your-dockerhub-username/product-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: DATABASE_URL
          value: "postgresql+psycopg://postgres:postgres@postgres-db:5432/orders_db"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
