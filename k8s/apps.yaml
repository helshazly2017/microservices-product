apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        # ✅ FIXED: Points check target to postgres_db to align with infrastructure services
        command: ['sh', '-c', 'until nc -z postgres_db 5432 && nc -z rabbitmq 5672; do echo waiting for db and mq; sleep 2; done;']
      containers:
      - name: product-service
        image: helshazly/product-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        # ✅ FIXED: Corrected domain routing endpoint string to look at postgres_db
        - name: DATABASE_URL
          value: "postgresql+psycopg://postgres:postgres@postgres_db:5432/orders_db"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        # ✅ FIXED: Points check target to postgres_db
        command: ['sh', '-c', 'until nc -z postgres_db 5432 && nc -z rabbitmq 5672; do echo waiting for db and mq; sleep 2; done;']
      containers:
      - name: order-service
        image: helshazly/order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        # ✅ FIXED: Corrected domain routing endpoint string to look at postgres_db
        - name: DATABASE_URL
          value: "postgresql+psycopg://postgres:postgres@postgres_db:5432/orders_db"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort 
  selector:
    app: order-service
  ports:
  - port: 8002
    targetPort: 8002
    nodePort: 30082
